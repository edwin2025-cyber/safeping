# Mosquitto settings for the SafePing server.
# Make a password file first:
#   mosquitto_passwd -c /etc/mosquitto/safeping_passwd safeping
# Then start the broker with:  mosquitto -c mosquitto.conf

listener 1883
allow_anonymous false
password_file /etc/mosquitto/safeping_passwd

# The Fobs, Relay and Reference all use the same username and password.
# Put them in each device's config.py and in the server's MQTT_USER / MQTT_PASS.
